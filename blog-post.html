<body>

        <div class="button btn-max"></div>

    <div class="window-body">

      <nav class="sidebar">

        <div class="widget clock-widget">
          <div class="widget-title"><i data-lucide="clock" class="widget-icon"></i> Clock</div>
          <div class="clock-time" id="clock">--:--:--</div>
          <div class="clock-date" id="clock-date">---</div>
        </div>

        <div class="widget">
          <div class="widget-title"><i data-lucide="share-2" class="widget-icon"></i> Find Me</div>
          <div class="social-links">

              <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>

      </nav>

      <!-- Reading area -->
      <div class="reading-area" id="post-container">
        <div class="loading-msg">
          <i data-lucide="loader" class="spin-icon"></i>
          Loading post...
        </div>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <span>Noi's Web Zone &mdash; Made with love in Germany</span>
    <span id="footer-time"></span>
  </div>

  <script>
    lucide.createIcons();

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE');
      document.getElementById('clock-date').textContent = now.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short'});
      document.getElementById('footer-time').textContent = now.toLocaleTimeString('de-DE');
    }
    updateClock();
    setInterval(updateClock, 1000);

    function formatDate(str) {
      const [y, m, d] = str.split('-');
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
    }

    function renderContent(blocks) {
      return blocks.map(block => {
        if (block.type === 'paragraph') return `<p class="post-body-p">${block.text}</p>`;
        if (block.type === 'heading')   return `<h3 class="post-body-h">${block.text}</h3>`;
        if (block.type === 'image')     return `<img src="${block.src}" alt="${block.alt || ''}" class="post-body-img">`;
        if (block.type === 'quote')     return `<blockquote class="post-body-quote">${block.text}</blockquote>`;
        if (block.type === 'divider')   return `<hr class="post-body-hr">`;
        if (block.type === 'list')      return `<ul class="post-body-ul">${block.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
        return '';
      }).join('');
    }

    const params = new URLSearchParams(location.search);
    const postId = params.get('id');

    if (!postId) {
      document.getElementById('post-container').innerHTML = '<p class="error-msg">No post specified.</p>';
    } else {
      fetch('blog-entries/posts.json')
        .then(r => r.json())
        .then(posts => {
          const post = posts.find(p => p.id === postId);
          if (!post) {
            document.getElementById('post-container').innerHTML = '<p class="error-msg">Post not found.</p>';
            return;
          }
          document.title = post.title + ' — Noi\'s Site';
          document.getElementById('post-container').innerHTML = `
            <a href="shell.html#blog.html" class="back-link">
              <i data-lucide="arrow-left" class="back-icon"></i> Back to Blog
            </a>
            <div class="post-full">
              <div class="post-full-meta">
                <span class="post-date"><i data-lucide="calendar" class="meta-icon"></i> ${formatDate(post.date)}</span>
                <span class="post-tags">${post.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span>
              </div>
              <h1 class="post-full-title">${post.title}</h1>
              <p class="post-full-summary">${post.summary}</p>
              <hr class="post-divider">
              <div class="post-full-body">
                ${renderContent(post.content)}
              </div>
            </div>
          `;
          lucide.createIcons();
        })
        .catch(() => {
          document.getElementById('post-container').innerHTML = '<p class="error-msg">Couldn\'t load post data.</p>';
        });
    }
  </script>
</body>
</html>
