<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="video.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <div>
    <div class="page-title">Videos</div>
    <div class="page-subtitle">Everything I've uploaded — sorted by series.</div>
  </div>

  <div id="video-root"></div>

  <script>
    lucide.createIcons();

    function formatDate(str) {
      const [y, m, d] = str.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
    }

    function thumb(youtubeId) {
      return `https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg`;
    }

    fetch('video-entries/videos.json')
      .then(r => r.json())
      .then(videos => {
        const sorted = [...videos].sort((a,b) => new Date(b.date) - new Date(a.date));
        const root = document.getElementById('video-root');

        if (sorted.length === 0) {
          root.innerHTML = '<p class="empty-msg">No videos yet — check back soon!</p>';
          return;
        }

        // Group by series, preserving order of first appearance
        const seriesOrder = [];
        const groups = {};
        sorted.forEach(v => {
          const s = v.series || 'Miscellaneous';
          if (!groups[s]) { groups[s] = []; seriesOrder.push(s); }
          groups[s].push(v);
        });

        root.innerHTML = seriesOrder.map(series => `
          <div class="series-block">
            <div class="series-header">
              <i data-lucide="folder-open" class="series-icon"></i>
              <span>${series}</span>
              <span class="series-count">${groups[series].length} video${groups[series].length !== 1 ? 's' : ''}</span>
            </div>
            <div class="video-grid">
              ${groups[series].map(v => `
                <a class="video-card" href="video-watch.html?id=${encodeURIComponent(v.id)}" target="_top">
                  <div class="video-thumb-wrap">
                    <img class="video-thumb" src="${thumb(v.youtubeId)}" alt="${v.title}" loading="lazy">
                    <div class="play-overlay">
                      <div class="play-btn"><i data-lucide="play" class="play-icon"></i></div>
                    </div>
                  </div>
                  <div class="video-info">
                    <div class="video-title">${v.title}</div>
                    <div class="video-date"><i data-lucide="calendar" class="vd-icon"></i> ${formatDate(v.date)}</div>
                    <div class="video-desc">${v.description}</div>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');

        lucide.createIcons();
      })
      .catch(() => {
        document.getElementById('video-root').innerHTML =
          '<p class="error-msg">Couldn\'t load videos. Make sure videos.json is in the video-entries/ folder.</p>';
      });
  </script>
</body>
</html>
