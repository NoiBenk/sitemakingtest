<head>

  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="status.css">

<body>

  <div class="bg-orb orb1"></div>

  <div class="bg-orb orb3"></div>

  <div class="container">
    <div class="window-header">
      <span class="title-bar-left">
        <img src="litten-profile.png" alt="Icon" class="title-icon">

      <div class="buttons">

        <div class="button btn-max" title="Maximize"></div>
        <div class="button btn-close" title="Close"></div>

    </div>

    <div class="window-body">
      <nav class="sidebar">

        <!-- Profile block -->
        <div class="profile-block">
          <div class="profile-name">Noi</div>
          <div class="profile-avatar-wrap">
            <img src="litten-profile.png" alt="Noi's profile pic" class="profile-avatar">
          </div>
          <div class="profile-status-line" id="sidebar-status-line">...</div>
        </div>

        <div class="sidebar-label">Navigation</div>
        <ul id="nav-links">
          <li><a href="#" data-page="home.html"><i data-lucide="house" class="nav-icon"></i> Home</a></li>
          <li><a href="#" data-page="status.html"><i data-lucide="radio" class="nav-icon"></i> Status</a></li>
          <li><a href="#" data-page="blog.html"><i data-lucide="notebook-pen" class="nav-icon"></i> Blog</a></li>
          <li><a href="#" data-page="video.html"><i data-lucide="clapperboard" class="nav-icon"></i> Videos</a></li>
          <li><a href="#" data-page="games.html"><i data-lucide="gamepad-2" class="nav-icon"></i> Games</a></li>
          <li class="disabled"><i data-lucide="lock" class="nav-icon"></i> [coming soon]</li>
        </ul>

        <!-- Clock widget -->
        <div class="widget clock-widget">
          <div class="widget-title"><i data-lucide="clock" class="widget-icon"></i> Clock</div>
          <div class="clock-time" id="clock">--:--:--</div>
          <div class="clock-date" id="clock-date">---</div>
        </div>

        <!-- Social links widget -->
        <div class="widget socials-widget">
          <div class="widget-title"><i data-lucide="share-2" class="widget-icon"></i> Find Me</div>
          <div class="social-links">
            <a href="https://www.youtube.com/@NoiBeniktont" class="social-link yt" title="YouTube" target="_blank">
              <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              <span>YouTube</span>
            </a>
            <a href="https://bsky.app/profile/noibenk.bsky.social" class="social-link bsky" title="Bluesky" target="_blank">
              <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.308.953 3.195 2.05 9.271 7.733 4.308 4.267-4.308 1.172-6.498-2.74-7.078a8.741 8.741 0 0 1-.415-.056c.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.204-.659-.299-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8z"/></svg>
              <span>Bluesky</span>
            </a>
            <a href="https://www.instagram.com/noibeniktont/" class="social-link ig" title="Instagram" target="_blank">
              <svg class="social-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
              <span>Instagram</span>
            </a>
            <a href="https://x.com/NoiBenk1234" class="social-link tw" title="Twitter / X" target="_blank">

              <span>Twitter</span>
            </a>
          </div>
        </div>
      </nav>

      <iframe id="content-frame" src="home.html" title="Page content"></iframe>
    </div>
  </div>

  <div class="footer-bar">
    <span>Noi's Web Zone &mdash; Made with love in Germany</span>
    <span id="footer-time"></span>
  </div>

  <script>
    lucide.createIcons();

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE');
      document.getElementById('clock-date').textContent = now.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short'});
      document.getElementById('footer-time').textContent = now.toLocaleTimeString('de-DE');
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Nav
    const frame = document.getElementById('content-frame');
    const navLinks = document.querySelectorAll('#nav-links a[data-page]');

    function navigate(page, linkEl) {
      frame.src = page;
      navLinks.forEach(l => l.classList.remove('active'));
      if (linkEl) linkEl.classList.add('active');
      history.pushState({page}, '', '#' + page);
    }

    navLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        navigate(link.dataset.page, link);
      });
    });

    function loadFromHash() {
      const hash = location.hash.replace('#', '');
      const match = [...navLinks].find(l => l.dataset.page === hash);
      if (match) {
        navigate(hash, match);
      } else {
        const home = document.querySelector('[data-page="home.html"]');
        if (home) home.classList.add('active');
      }
    }
    loadFromHash();
    window.addEventListener('popstate', loadFromHash);

    // Sidebar latest status
    const MOODS = {
      happy:   { icon: 'smile',      color: '#e8a000' },
      excited: { icon: 'zap',        color: '#9933cc' },
      tired:   { icon: 'moon',       color: '#4477aa' },
      sad:     { icon: 'cloud-rain', color: '#5588bb' },
      angry:   { icon: 'flame',      color: '#cc3300' },
      chill:   { icon: 'coffee',     color: '#338855' },
      anxious: { icon: 'activity',   color: '#bb6600' },
      silly:   { icon: 'star',       color: '#dd44aa' },
    };

    fetch('status-entries/statuses.json')
      .then(r => r.json())
      .then(statuses => {
        const el = document.getElementById('sidebar-status-line');
        if (!statuses.length) { el.textContent = 'No status yet.'; return; }
        const latest = [...statuses].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
        const mood = MOODS[latest.mood] || { color: '#888' };
        el.innerHTML = `<span class="profile-status-mood-dot" style="background:${mood.color}"></span>${latest.text}`;
        el.title = latest.mood + ' — ' + new Date(latest.date).toLocaleDateString('de-DE');
      })
      .catch(() => {
        document.getElementById('sidebar-status-line').textContent = '...';
      });
  </script>
</body>
</html>
