<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="video.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <div id="watch-container">
    <div class="loading-msg">
      <i data-lucide="loader" class="spin-icon"></i>
      Loading video...
    </div>
  </div>

  <!-- Related videos sidebar panel (rendered below on small content area) -->
  <div id="related-panel"></div>

  <script>
    lucide.createIcons();

    function formatDate(str) {
      const [y, m, d] = str.split('-');
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
    }

    function thumb(youtubeId) {
      return `https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg`;
    }

    function goBack() {
      window.parent.postMessage({ navigate: 'video.html' }, '*');
    }

    function goTo(id) {
      window.parent.postMessage({ navigate: 'video-watch.html?id=' + encodeURIComponent(id) }, '*');
    }

    const params = new URLSearchParams(location.search);
    const videoId = params.get('id');

    fetch('video-entries/videos.json')
      .then(r => r.json())
      .then(videos => {
        const video = videos.find(v => v.id === videoId);
        if (!video) {
          document.getElementById('watch-container').innerHTML = '<p class="error-msg">Video not found.</p>';
          return;
        }

        document.getElementById('watch-container').innerHTML = `
          <button class="back-link" onclick="goBack()">
            <i data-lucide="arrow-left" class="back-icon"></i> Back to Videos
          </button>
          <div class="watch-panel">
            <div class="embed-wrap">
              <iframe
                src="${video.embedUrl || 'https://www.youtube.com/embed/' + video.youtubeId}"
                title="${video.title}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <div class="watch-meta">
              <div class="watch-meta-row">
                <span class="watch-series"><i data-lucide="folder-open" class="wm-icon"></i> ${video.series || 'Miscellaneous'}</span>
                <span class="watch-date"><i data-lucide="calendar" class="wm-icon"></i> ${formatDate(video.date)}</span>
              </div>
              <h1 class="watch-title">${video.title}</h1>
              <hr class="watch-divider">
              <p class="watch-description">${video.description}</p>
              <a class="yt-link" href="https://www.youtube.com/watch?v=${video.youtubeId}" target="_blank">
                <svg viewBox="0 0 24 24" fill="currentColor" class="yt-link-icon"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                Watch on YouTube
              </a>
            </div>
          </div>
        `;

        // Related videos in same series
        const seriesVideos = videos
          .filter(v => v.series === video.series && v.id !== video.id)
          .sort((a,b) => new Date(a.date) - new Date(b.date));

        if (seriesVideos.length > 0) {
          document.getElementById('related-panel').innerHTML = `
            <div class="related-section">
              <div class="related-header"><i data-lucide="list-video" class="related-header-icon"></i> More in "${video.series}"</div>
              ${seriesVideos.map(v => `
                <button class="related-item" onclick="goTo('${v.id}')">
                  <img src="${thumb(v.youtubeId)}" class="related-thumb" alt="${v.title}">
                  <span class="related-title">${v.title}</span>
                </button>
              `).join('')}
            </div>
          `;
        }

        lucide.createIcons();
      })
      .catch(() => {
        document.getElementById('watch-container').innerHTML = '<p class="error-msg">Couldn\'t load video data.</p>';
      });
  </script>
</body>
</html>
